# Top-level Hydra config. Override any field via CLI, e.g.
#   uv run python -m narw_classifier.training.train trainer.max_epochs=20 model=efficientnet_b3_full_finetune

defaults:
  - data: baseline
  - preprocess: narw_mel
  - model: efficientnet_b3_linear_probe
  - trainer: default
  - logger: wandb
  - _self_

pipeline: efficientnet

seed: 42

# Resume training from a saved checkpoint, e.g.
#   ckpt_path=outputs/2026-05-23/10-42-17/checkpoints/last.ckpt
# Resolved against the original CWD via hydra.utils.to_absolute_path.
ckpt_path: null

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
