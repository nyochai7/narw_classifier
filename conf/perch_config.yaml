# Top-level Hydra config for the Perch v2 pipeline.
# Used by both `narw_classifier.training.extract_perch_embeddings` and
# `narw_classifier.training.train --config-name=perch_config`.

defaults:
  - data: baseline
  - preprocess: perch
  - model: perch_linear_probe
  - trainer: default
  - logger: wandb
  - _self_

# Override defaults that are EfficientNet-specific.
data:
  batch_size: 256       # larger: embeddings are tiny, training is cheap
  num_workers: 0        # embeddings live in RAM, no IO bottleneck

embeddings:
  cache_dir: data/embeddings/perch_v2
  onnx_dir: data/models
  onnx_file: perch_v2.onnx
  batch_size: 64        # ONNX inference batch size; bigger = fewer fixed-cost ORT calls
  num_workers: 8        # parallel preprocessing workers (librosa pitch_shift is CPU-bound)
  # ONNX providers, in priority order. `null` (default) auto-detects:
  # CUDA on Linux GPU, CoreML on Mac, CPU fallback. CoreML on Mac actually
  # *slows* Perch v2 down (only 448 of 725 ops supported → partition overhead);
  # set `embeddings.providers=[CPUExecutionProvider]` on Mac to skip it.
  providers: null

pipeline: perch

seed: 42
ckpt_path: null

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_perch
