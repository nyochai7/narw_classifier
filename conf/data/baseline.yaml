# Data loading config.

# Path to the directory that contains `train2/`, `test2/`, `sampleSubmission.csv`.
# On Lightning AI, override at runtime: `data.root=/teamspace/.../narw`.
root: data/raw
train_subdir: train2

# Split.
# `split_strategy`: one of
#   - `day_stratified`: clips from the same date land entirely in train, val OR test
#     (avoids day-level leakage; recommended).
#   - `random`: plain stratified random split by label (faster but leaks across days).
# Three-way: train = 1 - val_fraction - test_fraction. The test split is the honest
# reportable number — never touched during training / hyperparameter selection.
split_strategy: day_stratified
val_fraction: 0.15
test_fraction: 0.15
split_seed: 42

# Loader
batch_size: 32
num_workers: 4
pin_memory: true

# WeightedRandomSampler -> class-balanced batches.
balanced_train_sampler: true
